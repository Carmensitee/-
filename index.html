// ============================ 常量 ============================
const TILE = 24;
const COLS = 26;
const ROWS = 26;
const W = COLS * TILE;
const H = ROWS * TILE;
const TANK_SIZE = 44;
const TANK_SPEED = 1.8;
const ENEMY_SPEED = 0.9;
const BULLET_SPEED = 4;
const ENEMY_BULLET_SPEED = 2.5;
const MAX_ENEMIES = 4;

// ============================ 烟花系统 ============================
class Firework {
  constructor() {
    this.particles = [];
    this.launchX = Math.random() * W;
    this.launchY = H;
    this.explodeY = 80 + Math.random() * (H - 250);
    this.exploded = false;
    this.trail = [];
    this.colors = ['#ff0','#f44','#4f4','#44f','#f4f','#4ff','#ff8800','#ff0088','#88ff00'];
    this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
  }
  update() {
    if (!this.exploded) {
      this.launchY -= 3 + Math.random() * 2;
      this.trail.push({ x: this.launchX, y: this.launchY, life: 10 });
      if (this.trail.length > 15) this.trail.shift();
      for (const t of this.trail) t.life--;
      this.trail = this.trail.filter(t => t.life > 0);
      if (this.launchY <= this.explodeY) {
        this.exploded = true;
        for (let i = 0; i < 40; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 5;
          this.particles.push({
            x: this.launchX, y: this.launchY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 50 + Math.random() * 40,
            color: this.colors[Math.floor(Math.random() * this.colors.length)],
            size: 2 + Math.random() * 3,
          });
        }
      }
    } else {
      for (const p of this.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.life--;
      }
      this.particles = this.particles.filter(p => p.life > 0);
    }
  }
  draw() {
    if (!this.exploded) {
      for (const t of this.trail) {
        ctx.globalAlpha = t.life / 10;
        ctx.fillStyle = this.color;
        ctx.fillRect(t.x - 1, t.y - 1, 3, 3);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.fillRect(this.launchX - 1.5, this.launchY - 4, 3, 8);
    } else {
      for (const p of this.particles) {
        const alpha = p.life / 70;
        ctx.globalAlpha = alpha * 0.8;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }
  get alive() { return !this.exploded || this.particles.length > 0; }
}

let fireworks = [];
let fireworkTimer = 0;

function updateFireworks() {
  if (!game || !game.gameOver || !game.win) return;
  fireworkTimer--;
  if (fireworkTimer <= 0) {
    fireworks.push(new Firework());
    fireworkTimer = 15 + Math.random() * 30;
  }
  for (const f of fireworks) f.update();
  fireworks = fireworks.filter(f => f.alive);
}

function drawFireworks() {
  for (const f of fireworks) f.draw();
}

function startFireworks() {
  fireworks = [];
  fireworkTimer = 0;
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      if (game && game.gameOver) fireworks.push(new Firework());
    }, i * 200);
  }
}

// ============================ 类定义 ============================
class Bullet {
  constructor(x, y, dir, isPlayer) {
    this.x = x; this.y = y;
    this.dir = dir;
    this.speed = isPlayer ? BULLET_SPEED : ENEMY_BULLET_SPEED;
    this.isPlayer = isPlayer;
    this.alive = true;
    this.size = 6;
  }
  update() {
    this.x += DX[this.dir] * this.speed;
    this.y += DY[this.dir] * this.speed;
    if (this.x < 0 || this.y < 0 || this.x > W || this.y > H) {
      this.alive = false; return;
    }
    const cx = this.x + this.size / 2;
    const cy = this.y + this.size / 2;
    const col = Math.floor(cx / TILE);
    const row = Math.floor(cy / TILE);
    if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
      const cell = game.grid[row][col];
      if (cell === 1) {
        game.grid[row][col] = 0;
        this.alive = false;
        return;
      } else if (cell === 2) {
        this.alive = false;
        return;
      } else if (cell === 3) {
        game.grid[row][col] = 0;
        this.alive = false;
        game.baseDestroyed = true;
        gameOver(false);
        return;
      }
    }
    if (this.isPlayer) {
      for (let e of game.enemies) {
        if (!e.alive) continue;
        if (rectCollide(this.x, this.y, this.size, this.size, e.x, e.y, TANK_SIZE, TANK_SIZE)) {
          e.alive = false;
          this.alive = false;
          game.score += 100;
          updateHUD();
          game.explosions.push({ x: e.x + TANK_SIZE/2, y: e.y + TANK_SIZE/2, timer: 15, maxTimer: 15 });
          setTimeout(() => spawnEnemy(), 800);
          return;
        }
      }
    } else {
      if (!game.player || !game.player.alive) return;
      if (rectCollide(this.x, this.y, this.size, this.size, game.player.x, game.player.y, TANK_SIZE, TANK_SIZE)) {
        this.alive = false;
        playerHit();
      }
    }
  }
  draw() {
    if (!this.alive) return;
    ctx.fillStyle = this.isPlayer ? '#fff' : '#ff8';
    ctx.shadowBlur = 8;
    ctx.shadowColor = this.isPlayer ? '#4fc3f7' : '#ff5722';
    ctx.fillRect(this.x, this.y, this.size, this.size);
    ctx.shadowBlur = 0;
  }
}

class Tank {
  constructor(x, y, dir, isPlayer) {
    this.x = x; this.y = y;
    this.dir = dir;
    this.isPlayer = isPlayer;
    this.speed = isPlayer ? TANK_SPEED : ENEMY_SPEED;
    this.alive = true;
    this.cooldown = 0;
    this.size = TANK_SIZE;
    this.moveTimer = 0;
  }
  get cx() { return this.x + this.size / 2; }
  get cy() { return this.y + this.size / 2; }

  canMove(nx, ny) {
    if (nx < 0 || ny < 0 || nx + this.size > W || ny + this.size > H) return false;
    const margin = 2;
    const points = [
      [nx + margin, ny + margin],
      [nx + this.size - margin, ny + margin],
      [nx + margin, ny + this.size - margin],
      [nx + this.size - margin, ny + this.size - margin],
    ];
    for (const [px, py] of points) {
      const c = Math.floor(px / TILE);
      const r = Math.floor(py / TILE);
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
      const cell = game.grid[r][c];
      if (cell === 1 || cell === 2 || cell === 3) return false;
    }
    const others = this.isPlayer ? game.enemies :
      [game.player, ...game.enemies.filter(e => e !== this)];
    for (const t of others) {
      if (!t || !t.alive) continue;
      if (rectCollide(nx, ny, this.size, this.size, t.x, t.y, t.size, t.size)) return false;
    }
    return true;
  }

  move(dir) {
    this.dir = dir;
    const nx = this.x + DX[dir] * this.speed;
    const ny = this.y + DY[dir] * this.speed;
    if (this.canMove(nx, ny)) {
      this.x = nx; this.y = ny;
      return true;
    }
    return false;
  }

  shoot() {
    if (this.cooldown > 0) return null;
    this.cooldown = 15;
    let bx = this.x + this.size / 2 - 3;
    let by = this.y + this.size / 2 - 3;
    bx += DX[this.dir] * (this.size / 2 + 2);
    by += DY[this.dir] * (this.size / 2 + 2);
    return new Bullet(bx, by, this.dir, this.isPlayer);
  }

  update() {
    if (this.cooldown > 0) this.cooldown--;
  }

  draw() {
    if (!this.alive) return;
    const x = this.x, y = this.y, s = this.size;
    const isP = this.isPlayer;
    const colors = isP
      ? { body: '#4a90d9', track: '#2c5f8a', turret: '#1e3d5e', barrel: '#1e3d5e' }
      : { body: '#d44', track: '#922', turret: '#611', barrel: '#611' };
    const tw = 7;
    ctx.fillStyle = colors.track;
    if (this.dir === DIR.UP || this.dir === DIR.DOWN) {
      ctx.fillRect(x, y, tw, s);
      ctx.fillRect(x + s - tw, y, tw, s);
    } else {
      ctx.fillRect(x, y, s, tw);
      ctx.fillRect(x, y + s - tw, s, tw);
    }
    ctx.fillStyle = '#333';
    if (this.dir === DIR.UP || this.dir === DIR.DOWN) {
      for (let i = 0; i < s; i += 8) {
        ctx.fillRect(x + 1, y + i, tw - 2, 3);
        ctx.fillRect(x + s - tw + 1, y + i, tw - 2, 3);
      }
    } else {
      for (let i = 0; i < s; i += 8) {
        ctx.fillRect(x + i, y + 1, 3, tw - 2);
        ctx.fillRect(x + i, y + s - tw + 1, 3, tw - 2);
      }
    }
    ctx.fillStyle = colors.body;
    ctx.fillRect(
      x + (this.dir === DIR.UP || this.dir === DIR.DOWN ? tw : 0),
      y + (this.dir === DIR.LEFT || this.dir === DIR.RIGHT ? tw : 0),
      s - (this.dir === DIR.UP || this.dir === DIR.DOWN ? tw * 2 : 0),
      s - (this.dir === DIR.LEFT || this.dir === DIR.RIGHT ? tw * 2 : 0)
    );
    ctx.fillStyle = colors.turret;
    const cx = x + s / 2, cy = y + s / 2;
    ctx.beginPath(); ctx.arc(cx, cy, s * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = colors.barrel;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(cx + DX[this.dir] * (s * 0.1), cy + DY[this.dir] * (s * 0.1));
    ctx.lineTo(cx + DX[this.dir] * (s * 0.35), cy + DY[this.dir] * (s * 0.35));
    ctx.stroke();
  }
}

class Player extends Tank {
  constructor() {
    super(2, 24 * TILE, DIR.UP, true);
  }
}

class Enemy extends Tank {
  constructor() {
    const spawns = [4, 12 * TILE + 6, W - TANK_SIZE - 4];
    const sx = spawns[Math.floor(Math.random() * 3)];
    super(sx, 1 * TILE + 4, DIR.DOWN, false);
    this.shootTimer = 60 + Math.random() * 60;
    this.moveTimer = 60 + Math.random() * 40;
  }
  update() {
    super.update();
    if (!this.alive) return;
    this.shootTimer--;
    this.moveTimer--;
    if (this.moveTimer <= 0) {
      this.moveTimer = 40 + Math.random() * 60;
      this.dir = Math.floor(Math.random() * 4);
    }
    if (!this.move(this.dir)) {
      const dirs = [0, 1, 2, 3].filter(d => d !== this.dir);
      for (let i = dirs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
      }
      for (const d of dirs) {
        if (this.move(d)) break;
      }
    }
    if (this.shootTimer <= 0) {
      this.shootTimer = 80 + Math.random() * 80;
      const b = this.shoot();
      if (b) game.bullets.push(b);
    }
  }
}

// ============================ 工具函数 ============================
function rectCollide(x1, y1, w1, h1, x2, y2, w2, h2) {
  return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
}

function updateHUD() {
  scoreDisplay.textContent = game.score;
  livesDisplay.textContent = game.lives;
  enemiesDisplay.textContent = game.enemiesTotal;
  levelDisplay.textContent = game.level;
}

// ============================ 游戏逻辑 ============================
function spawnEnemy() {
  if (!game || game.gameOver || game.enemiesTotal <= 0) return;
  if (game.enemies.filter(e => e.alive).length >= MAX_ENEMIES) return;
  const spawns = [4, 12 * TILE + 6, W - TANK_SIZE - 4];
  const spawnX = spawns[Math.floor(Math.random() * 3)];
  const spawnY = 1 * TILE + 4;
  for (const t of game.enemies) {
    if (!t.alive) continue;
    if (Math.abs(t.x - spawnX) < TANK_SIZE && Math.abs(t.y - spawnY) < TANK_SIZE) {
      setTimeout(() => spawnEnemy(), 500);
      return;
    }
  }
  const enemy = new Enemy();
  enemy.x = spawnX;
  enemy.y = spawnY;
  game.enemies.push(enemy);
  game.enemiesTotal--;
  updateHUD();
}

function playerHit() {
  if (!game || !game.player) return;
  game.player.alive = false;
  game.explosions.push({ x: game.player.x + TANK_SIZE/2, y: game.player.y + TANK_SIZE/2, timer: 20, maxTimer: 20 });
  game.lives--;
  updateHUD();
  if (game.lives <= 0) {
    gameOver(false);
  } else {
    setTimeout(() => {
      if (game && !game.gameOver) {
        game.player = new Player();
      }
    }, 1000);
  }
}

function gameOver(win) {
  if (!game || game.gameOver) return;
  game.gameOver = true;
  game.win = win;
  if (win && game.level >= LEVELS.length) {
    statusText.textContent = '🎉 恭喜通关！坦克大战冠军！';
    statusText.style.color = '#ffd700';
    setTimeout(startFireworks, 300);
  } else if (win) {
    statusText.textContent = `🎉 第 ${game.level} 关通过！`;
    statusText.style.color = '#ffd700';
  } else {
    statusText.textContent = '💀 游戏结束';
    statusText.style.color = '#f44336';
  }
  restartBtn.classList.add('show');
}

function restartGame() {
  if (animId) cancelAnimationFrame(animId);
  fireworks = [];
  initGame();
  gameLoop();
}

function advanceLevel() {
  game.level++;
  const cfg = LEVELS[game.level - 1];
  game.enemiesTotal = cfg.enemies;
  game.grid = MAPS[cfg.mapIndex].map(row => row.split('').map(Number));
  game.enemies = [];
  game.bullets = [];
  game.explosions = [];
  game.player = new Player();
  game.baseDestroyed = false;
  game.gameOver = false;
  game.win = false;
  fireworks = [];
  updateHUD();
  statusText.textContent = `第 ${game.level} 关 - ${cfg.name}`;
  statusText.style.color = '#4caf50';
  restartBtn.classList.remove('show');
  for (let i = 0; i < 2; i++) {
    setTimeout(() => spawnEnemy(), i * 200);
  }
  }

function checkWin() {
  if (!game || game.gameOver) return;
  if (game.enemiesTotal <= 0 && game.enemies.filter(e => e.alive).length === 0) {
    if (game.level >= LEVELS.length) {
      gameOver(true);
    } else {
      gameOver(true);
      // 2秒后进入下一关
      setTimeout(() => {
        if (game && !game.baseDestroyed) {
          advanceLevel();
        }
      }, 2000);
    }
  }
}

// ============================ 渲染 ============================
function drawGrid() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = game.grid[r][c];
      if (cell === 0) {
        ctx.fillStyle = (r + c) % 2 === 0 ? '#1a1a1a' : '#1e1e1e';
        ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
      } else if (cell === 1) {
        ctx.fillStyle = '#c67a3a';
        ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        ctx.fillStyle = '#a0602a';
        ctx.fillRect(c * TILE, r * TILE, TILE / 2 - 1, TILE / 2 - 1);
        ctx.fillRect(c * TILE + TILE / 2 + 1, r * TILE, TILE / 2 - 1, TILE / 2 - 1);
        ctx.fillRect(c * TILE, r * TILE + TILE / 2 + 1, TILE / 2 - 1, TILE / 2 - 1);
        ctx.fillRect(c * TILE + TILE / 2 + 1, r * TILE + TILE / 2 + 1, TILE / 2 - 1, TILE / 2 - 1);
        ctx.strokeStyle = '#8a4a1a';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(c * TILE, r * TILE, TILE, TILE);
      } else if (cell === 2) {
        ctx.fillStyle = '#9e9e9e';
        ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        ctx.fillStyle = '#bdbdbd';
        ctx.fillRect(c * TILE + 2, r * TILE + 2, TILE / 2 - 4, TILE / 2 - 4);
        ctx.fillRect(c * TILE + TILE / 2 + 2, r * TILE + 2, TILE / 2 - 4, TILE / 2 - 4);
        ctx.fillRect(c * TILE + 2, r * TILE + TILE / 2 + 2, TILE / 2 - 4, TILE / 2 - 4);
        ctx.fillRect(c * TILE + TILE / 2 + 2, r * TILE + TILE / 2 + 2, TILE / 2 - 4, TILE / 2 - 4);
        ctx.strokeStyle = '#757575';
        ctx.lineWidth = 1;
        ctx.strokeRect(c * TILE, r * TILE, TILE, TILE);
      } else if (cell === 3) {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        const hx = c * TILE + TILE / 2;
        const hy = r * TILE + TILE / 2 + 2;
        ctx.fillStyle = '#ffd700';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffd700';
        ctx.beginPath();
        ctx.moveTo(hx, hy - 8);
        ctx.lineTo(hx + 5, hy);
        ctx.lineTo(hx + 2, hy);
        ctx.lineTo(hx + 2, hy + 4);
        ctx.lineTo(hx - 2, hy + 4);
        ctx.lineTo(hx - 2, hy);
        ctx.lineTo(hx - 5, hy);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }
}

function drawExplosions() {
  for (let i = game.explosions.length - 1; i >= 0; i--) {
    const exp = game.explosions[i];
    exp.timer--;
    const progress = 1 - exp.timer / exp.maxTimer;
    const size = progress * 35;
    const alpha = 1 - progress;
    ctx.fillStyle = `rgba(255, ${200 - progress * 100 | 0}, 0, ${alpha})`;
    ctx.beginPath();
    ctx.arc(exp.x, exp.y, size, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255, 255, 200, ${alpha * 0.5})`;
    ctx.beginPath();
    ctx.arc(exp.x, exp.y, size * 0.4, 0, Math.PI * 2);
    ctx.fill();
    if (exp.timer <= 0) game.explosions.splice(i, 1);
  }
}

// ============================ 主循环 ============================
function gameLoop() {
  if (!game) return;
  if (!game.gameOver) {
    update();
  }
  updateFireworks();
  render();
  animId = requestAnimationFrame(gameLoop);
}

function update() {
  if (!game || !game.player) return;
  if (game.player.alive) {
    if (keys['ArrowUp'] || keys['KeyW']) game.player.move(DIR.UP);
    else if (keys['ArrowDown'] || keys['KeyS']) game.player.move(DIR.DOWN);
    else if (keys['ArrowLeft'] || keys['KeyA']) game.player.move(DIR.LEFT);
    else if (keys['ArrowRight'] || keys['KeyD']) game.player.move(DIR.RIGHT);
    game.player.update();
    if (keys['Space']) {
      const b = game.player.shoot();
      if (b) game.bullets.push(b);
    }
  }
  for (const e of game.enemies) { if (e.alive) e.update(); }
  for (const b of game.bullets) { if (b.alive) b.update(); }
  game.bullets = game.bullets.filter(b => b.alive);
  game.enemies = game.enemies.filter(e => e.alive);
  checkWin();
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawGrid();
  if (game.player && game.player.alive) game.player.draw();
  for (const e of game.enemies) { if (e.alive) e.draw(); }
  for (const b of game.bullets) b.draw();
  drawExplosions();
  drawFireworks();

  if (game.gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    if (game.win && game.level >= LEVELS.length) {
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 42px Arial';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#ffd700';
      ctx.fillText('🏆 恭喜通关!', W / 2, H / 2 - 30);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = '20px Arial';
      ctx.fillText(`最终得分: ${game.score}`, W / 2, H / 2 + 30);
      ctx.fillStyle = '#ffd700';
      ctx.font = '16px Arial';
      ctx.fillText('坦克大战冠军!', W / 2, H / 2 + 65);
    } else if (game.win) {
      ctx.fillStyle = '#4caf50';
      ctx.font = 'bold 40px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('第 ' + game.level + ' 关通过!', W / 2, H / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = '18px Arial';
      ctx.fillText('即将进入下一关...', W / 2, H / 2 + 40);
    } else {
      ctx.fillStyle = '#f44336';
      ctx.font = 'bold 48px Arial';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#f44336';
      ctx.fillText('游戏结束', W / 2, H / 2 - 20);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = '20px Arial';
      ctx.fillText(`最终得分: ${game.score}`, W / 2, H / 2 + 40);
    }
    ctx.fillStyle = '#aaa';
    ctx.font = '14px Arial';
    ctx.fillText('按 Enter 或点击画面重新开始', W / 2, H / 2 + 85);
  }
}

// ============================ 初始化 ============================
function initGame() {
  const cfg = LEVELS[0];
  game = {
    grid: MAPS[cfg.mapIndex].map(row => row.split('').map(Number)),
    player: new Player(),
    enemies: [],
    bullets: [],
    explosions: [],
    fireworks: [],
    score: 0,
    lives: 3,
    level: 1,
    enemiesTotal: cfg.enemies,
    gameOver: false,
    win: false,
    baseDestroyed: false,
      };
  updateHUD();
  statusText.textContent = `第 1 关 - ${cfg.name}`;
  statusText.style.color = '#4caf50';
  restartBtn.classList.remove('show');
  for (let i = 0; i < 2; i++) {
    setTimeout(() => spawnEnemy(), i * 800);
  }
}

// ============================ 键盘事件 ============================
document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'Enter' && game && game.gameOver) {
    restartGame();
  }
});
document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});
canvas.addEventListener('click', () => {
  if (game && game.gameOver) restartGame();
});

// ============================ 启动 ============================
initGame();
gameLoop();
</script>
</body>
</html>
